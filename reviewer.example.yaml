# Reviewer model. Copy to reviewer.yaml (git-ignored) to change it locally; calibrate takes the same values unless
# overridden with --provider / --model / --reasoning.
reviewer:
  provider: anthropic          # any Hermes provider name
  model: claude-sonnet-5
  reasoning: medium            # Hermes reasoning effort: none, minimal, low, medium, high, xhigh
  timeout: 240                 # seconds; the hook waits up to plugins.hook_callback_timeout (set it to 300)
  language: English            # language of summaries and notes

calibration:
  reference_version: null      # a calibration run you trust; newer versions are compared against it
