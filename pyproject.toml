[project]
name = "skillwatch"
version = "0.1.0"
description = "Watch and review what the Hermes agent writes to its skills and memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillwatch"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
